product:
  type: kmp/lib
  platforms: [jvm, android]

# Common code is in src/. The only platform code is InputStream.asByteSource(), with one copy in
# src@jvm/ and one in src@android/ (an alias covering both platforms would equal common).

apply:
  - //common.module-template.yaml

test-dependencies:
  - //testkit

settings:
  android:
    namespace: ruggedmobile.sbf
  publishing:
    enabled: true
    group: za.co.ruggedmobile
    version: 0.1.0

repositories:
  - url: mavenLocal
    publish: true
